[package]
name = "vo-render"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "vulkan"] }
skrifa = "0.49"
bytemuck = { version = "1", features = ["derive"] }
# Image textures (EG-24) are Rgba16Float.
half = "2"
vo-scene = { path = "../vo-scene" }
vo-core = { path = "../vo-core" }
png = { version = "0.18", optional = true }
tiny-skia = { version = "0.12", default-features = false, features = ["std"], optional = true }

[features]
# PNG writer for offscreen frames (`offscreen::write_png`). Off for the live overlay.
png = ["dep:png"]
# CPU drawing of a display list (`cpu::CpuRenderer`), for the first frame while the GPU starts.
cpu = ["dep:tiny-skia"]

[dev-dependencies]
vo-core = { path = "../vo-core" }
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
tiny-skia = "0.12"
zeno = "0.3"
harfrust = "0.15"
unicode-linebreak = "0.1"
fontique = "0.12"
