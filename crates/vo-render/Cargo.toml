[package]
name = "vo-render"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "vulkan"] }
skrifa = "0.49"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
tiny-skia = "0.12"
zeno = "0.3"
harfrust = "0.15"
unicode-linebreak = "0.1"
fontique = "0.12"
