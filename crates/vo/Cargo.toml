[package]
name = "vo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Facade: run an app as a live overlay or render it offline to frames"

[features]
default = ["wayland"]
# The live overlay on Wayland. Without it only `render_offline` is available.
wayland = ["dep:vo-host-wayland"]
# Export to a PNG sequence or a video file through ffmpeg (plan decision 10).
export = []
# The preview and scrub tool: seek, a window with a timeline, live reload, contact sheets.
preview = ["record", "dep:toml", "dep:png", "dep:bytemuck"]
# Record an app's messages to a file and replay them as a scenario (`vo::record`).
record = ["dep:serde", "dep:serde_json"]

[dependencies]
vo-core = { path = "../vo-core" }
vo-scene = { path = "../vo-scene" }
vo-render = { path = "../vo-render", features = ["png", "cpu"] }
vo-host = { path = "../vo-host" }
vo-host-wayland = { path = "../vo-host-wayland", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }
png = { version = "0.18", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# The preview launcher: builds an example, runs it with `--preview`, rebuilds and replays to
# the same time when Rust sources change.
[[bin]]
name = "vo-preview"
path = "src/bin/vo-preview.rs"
required-features = ["preview"]

[dev-dependencies]
vo-dots = { path = "../vo-dots" }
# Tests and examples always see the export and preview code; the library only with the features.
vo = { path = ".", default-features = false, features = ["export", "preview"] }
